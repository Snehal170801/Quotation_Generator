openapi: 3.0.3
info:
  title: Quatation Generator API
  description: >
    Backend API for the Quatation Generator app. Two roles only — admin and
    sales. Admin manages categories and sales users; sales (and admin) create
    customers and orders, then print a PDF for the Project Head.
  version: 1.0.0

servers:
  - url: /api
    description: Same host/IP that served these docs (works on localhost or LAN IP)

tags:
  - name: Auth
  - name: Users
  - name: Categories
  - name: Customers
  - name: Orders

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    Error:
      type: object
      properties:
        message:
          type: string
      example:
        message: Something went wrong.

    User:
      type: object
      properties:
        id:
          type: string
          example: 6a3ba66d470bdb79a0081039
        name:
          type: string
          example: Super Admin
        email:
          type: string
          example: admin@quatation.com
        role:
          type: string
          enum: [admin, sales]
        isActive:
          type: boolean
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          example: admin@quatation.com
        password:
          type: string
          format: password
          example: Admin@123

    LoginResponse:
      type: object
      properties:
        token:
          type: string
          example: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...
        user:
          $ref: '#/components/schemas/User'

    CreateUserRequest:
      type: object
      required: [name, email, password, role]
      properties:
        name:
          type: string
        email:
          type: string
        password:
          type: string
          format: password
        role:
          type: string
          enum: [admin, sales]

    UpdateUserRequest:
      type: object
      properties:
        name:
          type: string
        email:
          type: string
        role:
          type: string
          enum: [admin, sales]
        isActive:
          type: boolean
        password:
          type: string
          format: password

    Customer:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        email:
          type: string
        phone:
          type: string
        address:
          type: string
        createdBy:
          type: string
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    CreateCustomerRequest:
      type: object
      required: [name, phone, address]
      properties:
        name:
          type: string
          example: Acme Studios
        email:
          type: string
          example: contact@acme.com
        phone:
          type: string
          example: '9876543210'
        address:
          type: string
          example: 123 Main Street, Kolhapur

    UpdateCustomerRequest:
      type: object
      properties:
        name:
          type: string
        email:
          type: string
        phone:
          type: string
        address:
          type: string

    Category:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        type:
          type: string
          enum: [product, hardware, software, other]
        parent:
          type: string
          nullable: true
          description: null = top-level section, ObjectId = child item
        isActive:
          type: boolean
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    CreateParentCategoryRequest:
      type: object
      required: [name, type]
      properties:
        name:
          type: string
          example: Hardware
        type:
          type: string
          enum: [product, hardware, software, other]

    CreateChildCategoryRequest:
      type: object
      required: [name, type, parent]
      properties:
        name:
          type: string
          example: GPU
        type:
          type: string
          enum: [product, hardware, software, other]
        parent:
          type: string
          description: ObjectId of the parent section

    UpdateCategoryRequest:
      type: object
      properties:
        name:
          type: string
        type:
          type: string
          enum: [product, hardware, software, other]
        isActive:
          type: boolean

    CategoryTreeNode:
      type: object
      properties:
        _id:
          type: string
        name:
          type: string
        type:
          type: string
        children:
          type: array
          items:
            type: object
            properties:
              _id:
                type: string
              name:
                type: string
              type:
                type: string

    Order:
      type: object
      properties:
        id:
          type: string
        customer:
          $ref: '#/components/schemas/Customer'
        items:
          type: array
          items:
            $ref: '#/components/schemas/Category'
        otherDetails:
          type: string
        status:
          type: string
          enum: [draft, saved]
        createdBy:
          type: string
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    CreateOrderRequest:
      type: object
      required: [customer]
      properties:
        customer:
          type: string
          description: Customer ObjectId
        items:
          type: array
          items:
            type: string
          description: Array of Category (item) ObjectIds
        otherDetails:
          type: string
          example: Rush order, deliver by Friday

    UpdateOrderRequest:
      type: object
      properties:
        customer:
          type: string
        items:
          type: array
          items:
            type: string
        otherDetails:
          type: string

    UpdateOrderStatusRequest:
      type: object
      required: [status]
      properties:
        status:
          type: string
          enum: [draft, saved]

  responses:
    Unauthorized:
      description: Missing/invalid token
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Forbidden:
      description: Authenticated, but role not allowed
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    NotFound:
      description: Resource not found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'

security:
  - bearerAuth: []

paths:
  /auth/login:
    post:
      tags: [Auth]
      summary: Log in (public)
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Login successful
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /auth/me:
    get:
      tags: [Auth]
      summary: Get the logged-in user's info
      responses:
        '200':
          description: Current user
          content:
            application/json:
              schema:
                type: object
                properties:
                  user:
                    $ref: '#/components/schemas/User'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /auth/logout:
    post:
      tags: [Auth]
      summary: Log out (client discards the JWT)
      responses:
        '200':
          description: Logged out
        '401':
          $ref: '#/components/responses/Unauthorized'

  /users:
    post:
      tags: [Users]
      summary: Create a user (admin only)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateUserRequest'
      responses:
        '201':
          description: User created
          content:
            application/json:
              schema:
                type: object
                properties:
                  user:
                    $ref: '#/components/schemas/User'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          description: Email already in use
    get:
      tags: [Users]
      summary: List all users (admin only)
      responses:
        '200':
          description: List of users
          content:
            application/json:
              schema:
                type: object
                properties:
                  users:
                    type: array
                    items:
                      $ref: '#/components/schemas/User'
        '403':
          $ref: '#/components/responses/Forbidden'

  /users/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
    put:
      tags: [Users]
      summary: Update a user (admin only)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateUserRequest'
      responses:
        '200':
          description: Updated user
          content:
            application/json:
              schema:
                type: object
                properties:
                  user:
                    $ref: '#/components/schemas/User'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      tags: [Users]
      summary: Deactivate a user — soft delete (admin only)
      responses:
        '200':
          description: User deactivated
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /categories/parent:
    post:
      tags: [Categories]
      summary: Create a new section (admin only)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateParentCategoryRequest'
      responses:
        '201':
          description: Section created
          content:
            application/json:
              schema:
                type: object
                properties:
                  category:
                    $ref: '#/components/schemas/Category'
        '403':
          $ref: '#/components/responses/Forbidden'

  /categories/child:
    post:
      tags: [Categories]
      summary: Create an item under a section (admin only)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateChildCategoryRequest'
      responses:
        '201':
          description: Item created
          content:
            application/json:
              schema:
                type: object
                properties:
                  category:
                    $ref: '#/components/schemas/Category'
        '400':
          description: Invalid or missing parent section
        '403':
          $ref: '#/components/responses/Forbidden'

  /categories/tree:
    get:
      tags: [Categories]
      summary: Get the full category tree (all roles — used by the sales form)
      responses:
        '200':
          description: Nested tree of sections and their items
          content:
            application/json:
              schema:
                type: object
                properties:
                  tree:
                    type: array
                    items:
                      $ref: '#/components/schemas/CategoryTreeNode'

  /categories/parents:
    get:
      tags: [Categories]
      summary: List all sections, flat (admin only)
      responses:
        '200':
          description: List of sections
          content:
            application/json:
              schema:
                type: object
                properties:
                  parents:
                    type: array
                    items:
                      $ref: '#/components/schemas/Category'
        '403':
          $ref: '#/components/responses/Forbidden'

  /categories/{parentId}/children:
    get:
      tags: [Categories]
      summary: List the items under one section (all roles)
      parameters:
        - name: parentId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: List of child items
          content:
            application/json:
              schema:
                type: object
                properties:
                  children:
                    type: array
                    items:
                      $ref: '#/components/schemas/Category'

  /categories/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
    put:
      tags: [Categories]
      summary: Rename / update a section or item (admin only)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateCategoryRequest'
      responses:
        '200':
          description: Updated category
          content:
            application/json:
              schema:
                type: object
                properties:
                  category:
                    $ref: '#/components/schemas/Category'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      tags: [Categories]
      summary: Delete a section or item (admin only)
      description: >
        Blocked with a 400 if deleting a section that still has child items
        under it — delete or move those first.
      responses:
        '200':
          description: Deleted
        '400':
          description: Section still has child items
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /customers:
    post:
      tags: [Customers]
      summary: Create a customer (all roles)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateCustomerRequest'
      responses:
        '201':
          description: Customer created
          content:
            application/json:
              schema:
                type: object
                properties:
                  customer:
                    $ref: '#/components/schemas/Customer'
    get:
      tags: [Customers]
      summary: List all customers (all roles)
      responses:
        '200':
          description: List of customers
          content:
            application/json:
              schema:
                type: object
                properties:
                  customers:
                    type: array
                    items:
                      $ref: '#/components/schemas/Customer'

  /customers/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
    get:
      tags: [Customers]
      summary: Get a single customer (all roles)
      responses:
        '200':
          description: Customer
          content:
            application/json:
              schema:
                type: object
                properties:
                  customer:
                    $ref: '#/components/schemas/Customer'
        '404':
          $ref: '#/components/responses/NotFound'
    put:
      tags: [Customers]
      summary: Update a customer (all roles)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateCustomerRequest'
      responses:
        '200':
          description: Updated customer
          content:
            application/json:
              schema:
                type: object
                properties:
                  customer:
                    $ref: '#/components/schemas/Customer'
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      tags: [Customers]
      summary: Delete a customer (admin only)
      responses:
        '200':
          description: Deleted
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /orders:
    post:
      tags: [Orders]
      summary: Create an order (all roles) — starts as draft
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateOrderRequest'
      responses:
        '201':
          description: Order created
          content:
            application/json:
              schema:
                type: object
                properties:
                  order:
                    $ref: '#/components/schemas/Order'
        '400':
          description: Missing or invalid customer
    get:
      tags: [Orders]
      summary: List all orders (all roles)
      responses:
        '200':
          description: List of orders, fully populated
          content:
            application/json:
              schema:
                type: object
                properties:
                  orders:
                    type: array
                    items:
                      $ref: '#/components/schemas/Order'

  /orders/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
    get:
      tags: [Orders]
      summary: Get a single order, fully populated (all roles)
      responses:
        '200':
          description: Order
          content:
            application/json:
              schema:
                type: object
                properties:
                  order:
                    $ref: '#/components/schemas/Order'
        '404':
          $ref: '#/components/responses/NotFound'
    put:
      tags: [Orders]
      summary: Update an order (all roles) — blocked once status is "saved"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateOrderRequest'
      responses:
        '200':
          description: Updated order
          content:
            application/json:
              schema:
                type: object
                properties:
                  order:
                    $ref: '#/components/schemas/Order'
        '400':
          description: Order is saved and locked
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      tags: [Orders]
      summary: Delete an order (admin only)
      responses:
        '200':
          description: Deleted
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /orders/{id}/status:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
    put:
      tags: [Orders]
      summary: Change order status, draft → saved (all roles)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateOrderStatusRequest'
      responses:
        '200':
          description: Updated order
          content:
            application/json:
              schema:
                type: object
                properties:
                  order:
                    $ref: '#/components/schemas/Order'
        '404':
          $ref: '#/components/responses/NotFound'